<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="4" fill="#ffffff" stroke="#111111" stroke-width="3"/>
  <!-- Simple fox head sketch -->
  <circle cx="16" cy="16" r="8" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="12" cy="14" r="1.5" fill="#111111"/>
  <circle cx="20" cy="14" r="1.5" fill="#111111"/>
  <!-- Ears -->
  <polygon points="9,10 12,5 15,11" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <polygon points="23,10 20,5 17,11" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <!-- Nose -->
  <circle cx="16" cy="19" r="1.8" fill="#111111"/>
  <!-- Turquoise accent line -->
  <path d="M9 22 Q16 25 23 22" stroke="#5eead4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
